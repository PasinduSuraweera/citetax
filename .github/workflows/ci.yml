# Every PR and every push to main: the web app lints, type checks and builds;
# the API's unit tests run with no database and no keys; the database tests run
# against a throwaway Postgres with pgvector, migrated and seeded from scratch.
# Nothing here can reach the shared Supabase (#61).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-not-a-secret
          NEXT_TELEMETRY_DISABLED: "1"

  api:
    name: API (unit and database tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citetax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: api
    env:
      AUTH_SECRET: ci-test-secret-not-a-secret
      GROQ_API_KEY: ""
      GOOGLE_API_KEY: ""
      WATCH_INTERVAL_MINUTES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: spaCy model for the redactor
        run: python -m spacy download en_core_web_sm

      - name: Unit tests (no database, no keys)
        run: python -m pytest -q -m "not db"

      - name: Migrate and seed a throwaway database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/citetax_test
        run: |
          python migrate.py
          python seed/rules_seed.py

      - name: Database tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/citetax_test
        run: python -m pytest -q -m db
