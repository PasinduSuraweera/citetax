<svg xmlns="http://www.w3.org/2000/svg" width="760" height="132" viewBox="0 0 760 132" role="img" aria-label="Of 1.3 million TIN holders in June 2026, about 130,000 pay tax and 1,170,000 do not yet">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <text x="0" y="22" font-size="19" font-weight="600" fill="#012151">1.3 million people hold a TIN. About 1 in 10 pays tax.</text>
  <rect x="0" y="44" width="760" height="30" rx="7" fill="#dfe6f0"/>
  <path d="M7 44 H76 V74 H7 A7 7 0 0 1 0 67 V51 A7 7 0 0 1 7 44 Z" fill="#0766d6"/>
  <rect x="0" y="98" width="12" height="12" rx="3" fill="#0766d6"/>
  <text x="20" y="109" font-size="14" fill="#4f5d7a">Paying tax</text>
  <text x="96" y="109" font-size="14" font-weight="600" fill="#012151">130,000</text>
  <rect x="200" y="98" width="12" height="12" rx="3" fill="#dfe6f0"/>
  <text x="220" y="109" font-size="14" fill="#4f5d7a">Not paying tax yet</text>
  <text x="352" y="109" font-size="14" font-weight="600" fill="#012151">1,170,000</text>
  <text x="760" y="109" font-size="13" fill="#4f5d7a" text-anchor="end">IRD, June 2026</text>
</svg>
